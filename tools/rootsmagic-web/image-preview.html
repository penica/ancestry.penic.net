<dialog id="image-preview" class="image-preview" aria-labelledby="image-preview-title">
  <header class="image-preview-header">
    <h2 id="image-preview-title">Image preview</h2>
    <form method="dialog">
      <button class="image-preview-close" type="submit" autofocus>Close</button>
    </form>
  </header>
  <div class="image-preview-body">
    <p id="image-preview-status" role="status" aria-live="polite"></p>
  </div>
</dialog>
