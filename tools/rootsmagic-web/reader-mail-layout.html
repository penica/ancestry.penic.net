<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
</head>
<body style="margin:0;background:#f6f5f0;color:#272f2b;font:16px/1.5 Arial,sans-serif">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
    <tr>
      <td align="center" style="padding:16px">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:600px;background:#fffefb;border:1px solid #d8ddd4">
          <tr>
            <td style="padding:24px;border-top:4px solid #294f40">
              <p style="margin:0 0 12px;color:#294f40;font:700 16px Georgia,serif">RootsMagic Reader</p>
              <h1 style="margin:0 0 16px;font:normal 28px/1.2 Georgia,serif">{{ title }}</h1>
              {% block message %}{% endblock %}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
